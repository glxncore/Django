<!DOCTYPE html>
<html>
<head>
    {% load static %}
    <link rel="stylesheet" type="text/css" href="{% static 'style.css' %}">
    <script src="{% static 'script.js' %}"></script>
</head>
<body>
    <h1>Hello World</h1>
    <button onclick="changeGreeting()">Click</button>

    <p>Count is {{count}}</p>
    <p>Count is {{count|safe}}</p>
     {% if count > 20 %}
    <p>Count is {{count}}</p>
    {% else %}
    <p>Count is not enough</p>
    {% endif %}
      {% for student in students %}
        <p>{{student}}</p>
    {% endfor %}
</body>
</html>
